name: guards

# 四道门禁（都不需要游戏安装）：
#  1) text-guards  ：文本层守卫（API 棘轮 / 契约边界 / 功能层边界 / 编码 / 悬浮文案 / 单文件行数 …）
#  2) schema-guards：槽位图 / 配置与本地化一致性（guards-schema.ps1）
#  3) rsp-verify   ：构建源码清单覆盖（gen-rsp.ps1 -Verify）
#  4) unit-tests   ：编译契约层 + 跑单元测试（tests/SR_UCH.Tests.csproj，BepInEx 与 UnityEngine 都用桩）
#     这一步同时充当"契约层必须能编译"的最小编译门禁 —— 编译不过的 PR 在 CI 里就会红。
# 需要游戏 Managed DLL 的守卫（csproj 构建 / 拆分构建 / 运行时自检）仍只在本地 build\build.ps1 -Check 里跑。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  text-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行文本类守卫
        shell: pwsh
        run: ./build/guards-text.ps1

  schema-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行结构守卫（槽位图 / 本地化覆盖）
        shell: pwsh
        run: ./build/guards-schema.ps1

  rsp-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建清单与磁盘源码一致性（不需要游戏）
        shell: pwsh
        run: ./build/gen-rsp.ps1 -Verify

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 契约层编译 + 单元测试（无游戏）
        shell: pwsh
        run: ./build/run-tests.ps1 -NoGame
