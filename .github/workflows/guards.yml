name: guards

# 3 个 job（都不需要游戏安装）：
#  1) guards      ：统一入口 verify --strict + 全部机械规则 + 冒烟 / 预检 / 闸门
#  2) tests       ：契约层 + 纯函数层真实编译与表驱动单测
#  3) build-graph ：构建图对账；提供游戏参考程序集时执行全源码 IL 编译
# 判定逻辑只有一份：tools/spec_engine.py 派生、tools/uch_rules.py 守卫。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 恢复派生物（spec 单一真值）
        run: python3 tools/uch.py materialize
      - name: 统一回归（固定 CHK 表 + 单一基线）
        run: python3 tools/uch.py verify --strict
      - name: 机械守卫唯一实现
        run: python3 tools/uch.py rules --suite all
      - name: 一条命令冒烟
        run: python3 tools/uch.py smoke
      - name: 按文件影响路由
        run: python3 tools/uch.py impact build/specs/features.spec.json
      - name: 可重放结构规则（幂等）
        run: python3 tools/uch.py codemod --apply
      - name: 结构改动清单 dry-run
        run: python3 tools/uch.py migrate --dry-run
      - name: 真编译前离线预检
        run: python3 tools/uch.py precompile
      - name: 双轨退役闸门（cutover 需实机 A/B 证据）
        run: python3 tools/uch.py trace-gate --enforce

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 恢复派生物（spec 单一真值）
        run: python3 tools/uch.py materialize
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 契约层编译 + 单元测试（无游戏）
        run: dotnet run --project tests/SR_UCH.Tests.csproj -c Release --nologo
      - name: 纯函数层表驱动测试（真实 IL 编译 + 运行）
        run: dotnet run --project tests/SR_UCH.Pure.Tests.csproj -c Release --nologo
      - name: 契约层 / 纯函数层真实编译（警告即失败）
        run: |
          dotnet build tests/SR_UCH.Tests.csproj -c Release --nologo -warnaserror
          dotnet build tests/SR_UCH.Pure.Tests.csproj -c Release --nologo -warnaserror

  build-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 恢复派生物（spec 单一真值）
        run: python3 tools/uch.py materialize
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 构建图对账（单一规则实现）
        run: python3 tools/uch.py rules --suite build-graph
      - name: 维护入口环境诊断
        run: python3 tools/uch.py doctor
      - name: 全源码 IL 编译（提供游戏参考程序集时执行）
        env:
          UCH_MANAGED: ${{ vars.UCH_MANAGED_DIR }}
        run: |
          if [ -n "$UCH_MANAGED" ]; then
            dotnet build SR_UCH.csproj -c Release --nologo -warnaserror -p:UchManagedDir="$UCH_MANAGED"
          else
            echo 'UCH_MANAGED_DIR 未配置：跳过全源码 IL 编译'
          fi
